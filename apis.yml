name: Openhandle
aid: openhandle
description: Openhandle is a public social data API for Instagram, TikTok, X (Twitter), and Reddit. Public
  profiles, posts, comments, followers, and search come back in one normalized schema, with a capture
  time and a source on every answer and nulls where a platform hides a value. Pricing is per answered
  request with cheaper cached tiers (free at 30 days), caps per account and per key, and a full Test environment
  on synthetic data at $0.000. The API is read-only over OpenAPI 3.1, three first-party SDKs (TypeScript,
  Python, Go), and a remote OAuth-protected MCP server. Operated as a Netherlands sole proprietorship
  (KvK 89247647).
